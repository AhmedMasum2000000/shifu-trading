<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifu Signal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="description" content="Free crypto signal helper with honest, live-measured accuracy.">
<style>
  :root {
    --bg: #0f1420; --card: #182033; --line: #2a3550; --text: #e8edf7; --muted: #8b97b3;
    --up: #1fbf6a; --down: #ef4b4b; --wait: #f2b230; --accent: #2f7cf6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  .lang { background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .step { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn { background: #222c44; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 6px; font-size: 15px; cursor: pointer; text-align: center; }
  .btn.on { background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .go { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 16px; font-size: 19px; font-weight: 800; cursor: pointer; }
  .go:disabled { opacity: .55; cursor: wait; }
  .signal { text-align: center; padding: 22px 10px; border-radius: 14px; margin-top: 4px; }
  .signal .big { font-size: 44px; font-weight: 900; letter-spacing: .02em; }
  .signal .sub { font-size: 15px; margin-top: 6px; }
  .UP { background: rgba(31,191,106,.15); color: var(--up); border: 2px solid var(--up); }
  .DOWN { background: rgba(239,75,75,.15); color: var(--down); border: 2px solid var(--down); }
  .WAIT { background: rgba(242,178,48,.12); color: var(--wait); border: 2px solid var(--wait); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: #111827; border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .verdict { margin-top: 12px; padding: 12px; border-radius: 10px; font-weight: 700; }
  .good { background: rgba(31,191,106,.15); color: var(--up); }
  .bad { background: rgba(239,75,75,.15); color: var(--down); }
  canvas { width: 100%; height: 180px; display: block; margin-top: 12px; background: #0b1020; border-radius: 10px; }
  .why { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .why li { margin: 2px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .w { color: var(--up); font-weight: 700; } .l { color: var(--down); font-weight: 700; } .p { color: var(--muted); }
  .warn { border-color: var(--wait); }
  .warn h2 { font-size: 17px; margin: 0 0 8px; color: var(--wait); }
  .warn p, .warn li { font-size: 14px; color: #cfd6e6; }
  .small { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=number] { width: 80px; background: #111827; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; font-size: 15px; }
  .clear { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📈 Shifu Signal</h1>
    <button class="lang" id="langBtn">বাংলা</button>
  </header>

  <div class="card">
    <div class="step" data-t="step1"></div>
    <div class="grid" id="assets"></div>
  </div>

  <div class="card">
    <div class="step" data-t="step2"></div>
    <div class="grid" id="times"></div>
    <div class="row" style="margin-top:12px">
      <span class="small" data-t="payout"></span>
      <input type="number" id="payout" value="85" min="10" max="100"> <span class="small">%</span>
    </div>
  </div>

  <button class="go" id="go" data-t="get"></button>

  <div class="card" id="result" style="display:none; margin-top:14px">
    <div class="step" data-t="step3"></div>
    <div class="signal" id="sigBox"><div class="big" id="sigBig"></div><div class="sub" id="sigSub"></div></div>
    <canvas id="chart" width="1040" height="360"></canvas>
    <ul class="why" id="why"></ul>
    <div class="stats">
      <div class="stat"><b id="btRate">–</b><span data-t="btLabel"></span></div>
      <div class="stat"><b id="beRate">–</b><span data-t="beLabel"></span></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="small" style="margin-top:8px" id="updated"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="step" data-t="history" style="margin:0"></div>
      <button class="clear" id="clear" data-t="clear"></button>
    </div>
    <div class="stats" style="margin-top:8px">
      <div class="stat"><b id="liveRate">–</b><span data-t="liveLabel"></span></div>
      <div class="stat"><b id="liveCount">0</b><span data-t="liveCountLabel"></span></div>
    </div>
    <table style="margin-top:10px"><thead><tr>
      <th data-t="thTime"></th><th data-t="thAsset"></th><th data-t="thSignal"></th><th data-t="thResult"></th>
    </tr></thead><tbody id="hist"></tbody></table>
  </div>

  <div class="card warn">
    <h2 data-t="warnTitle"></h2>
    <ul id="warnList"></ul>
  </div>

  <p class="small" data-t="footer"></p>
</div>

<script src="engine.js"></script>

// Free public market data, no account or key needed. Second host is a fallback.
const HOSTS = ['https://data-api.binance.vision', 'https://api.binance.com'];

      'যে টাকা হারালে সমস্যা নেই শুধু সেটা দিয়ে ট্রেড করুন। আগে Quotex ডেমো অ্যাকাউন্টে প্র্যাকটিস করুন।',
    ],
    footer: 'চিরকাল ফ্রি। লগইন, API key, সাবস্ক্রিপশন কিছু লাগে না। এটা আর্থিক পরামর্শ না।',
  },

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let lang = store.get('lang', 'en');
let asset = store.get('asset', 'BTCUSDT');
let time = store.get('time', '1m');
let history = store.get('history', []);
let last = null;

const $ = id => document.getElementById(id);
const t = (k, vars = {}) => String(T[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v]);

function renderText() {
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'en' ? 'বাংলা' : 'English';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('warnList').innerHTML = T[lang].warn.map(w => `<li>${w}</li>`).join('');
  if (last) showResult(last);
  renderHistory();
}

function renderPickers() {
  $('assets').innerHTML = ASSETS.map(a =>
    `<button class="btn ${a.id === asset ? 'on' : ''}" data-a="${a.id}">${a.name}</button>`).join('');
  $('times').innerHTML = TIMES.map(x =>
    `<button class="btn ${x.iv === time ? 'on' : ''}" data-iv="${x.iv}">${x.min} min</button>`).join('');
}

async function fetchCandles(symbol, iv, limit = 1000) {
  for (const h of HOSTS) {
    try {
      const r = await fetch(`${h}/api/v3/klines?symbol=${symbol}&interval=${iv}&limit=${limit}`);
      if (!r.ok) continue;
      const rows = await r.json();
      return rows.map(a => ({ time: a[0], open: +a[1], high: +a[2], low: +a[3], close: +a[4], closeTime: a[6] }));
    } catch {}
  }
  throw new Error('fetch failed');
}

async function getSignal() {
  const btn = $('go');
  btn.disabled = true;
  try {
    const candles = await fetchCandles(asset, time);
    const sig = Engine.latest(candles);
    const bt = Engine.backtest(candles);
    const be = Engine.breakEven(+$('payout').value || 85);
    const mins = TIMES.find(x => x.iv === time).min;
    last = { sig, bt, be, candles, mins, at: Date.now() };
    showResult(last);
    if (sig.dir !== 'WAIT') {
      const c = candles[candles.length - 1];
      // Trade is entered now, at the open of the forming candle; it is judged when that candle closes.
      history.unshift({ at: Date.now(), asset, iv: time, dir: sig.dir, entryTime: c.time, entry: c.open, result: null });
      history = history.slice(0, 50);
      store.set('history', history);
      renderHistory();
    }
  } catch (e) {
    alert(t('err'));
  } finally {
    btn.disabled = false;
  }
}

function showResult({ sig, bt, be, candles, mins, at }) {
  $('result').style.display = 'block';
  $('sigBox').className = 'signal ' + sig.dir;
  $('sigBig').textContent = t(sig.dir);
  $('sigSub').textContent = t('sub' + sig.dir, { m: mins }) +
    (sig.dir !== 'WAIT' ? ` · ${t('strength')} ${sig.strength}%` : '');
  $('why').innerHTML = sig.reasons.map(r => `<li>${t(r)}</li>`).join('');
  $('btRate').textContent = bt.total ? (bt.rate * 100).toFixed(1) + '%' : '–';
  $('beRate').textContent = (be * 100).toFixed(1) + '%';
  const ok = bt.total >= 30 && bt.rate > be;
  $('verdict').className = 'verdict ' + (ok ? 'good' : 'bad');
  $('verdict').textContent = t(ok ? 'good' : 'bad');
  $('updated').textContent = t('updated', { t: new Date(at).toLocaleTimeString() });
  drawChart(candles.slice(-60));
}

function drawChart(cs) {
  const cv = $('chart'), g = cv.getContext('2d');
  const W = cv.width, H = cv.height, pad = 16;
  g.clearRect(0, 0, W, H);
  const hi = Math.max(...cs.map(c => c.high)), lo = Math.min(...cs.map(c => c.low));
  const y = v => pad + (hi - v) / (hi - lo || 1) * (H - pad * 2);
  const step = (W - pad * 2) / cs.length;
  cs.forEach((c, i) => {
    const x = pad + i * step + step / 2;
    const col = c.close >= c.open ? '#1fbf6a' : '#ef4b4b';
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y(c.high)); g.lineTo(x, y(c.low)); g.stroke();
    const top = y(Math.max(c.open, c.close)), h = Math.max(2, Math.abs(y(c.open) - y(c.close)));
    g.fillRect(x - step * 0.35, top, step * 0.7, h);
  });
}

// Check pending signals against the real closing price once their candle has closed.
async function checkPending() {
  const pending = history.filter(h => !h.result);
  for (const h of pending) {
    const mins = TIMES.find(x => x.iv === h.iv).min;
    if (Date.now() < h.entryTime + mins * 60000 + 3000) continue;
    try {
      const r = await fetch(`${HOSTS[0]}/api/v3/klines?symbol=${h.asset}&interval=${h.iv}&startTime=${h.entryTime}&limit=1`);
      const row = (await r.json())[0];
      if (!row || row[0] !== h.entryTime) continue;
      const close = +row[4];
      h.result = close === h.entry ? 'tie' : ((close > h.entry) === (h.dir === 'UP') ? 'win' : 'loss');
    } catch {}
  }
  store.set('history', history);
  renderHistory();
}

function renderHistory() {
  const done = history.filter(h => h.result === 'win' || h.result === 'loss');
  const wins = done.filter(h => h.result === 'win').length;
  $('liveRate').textContent = done.length ? (wins / done.length * 100).toFixed(0) + '%' : '–';
  $('liveCount').textContent = done.length;
  $('hist').innerHTML = history.map(h => {
    const name = ASSETS.find(a => a.id === h.asset)?.name ?? h.asset;
    const cls = h.result === 'win' ? 'w' : h.result === 'loss' ? 'l' : 'p';
    const res = h.result ? t(h.result) : t('pending');
    return `<tr><td>${new Date(h.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
      <td>${name} · ${h.iv}</td><td>${h.dir === 'UP' ? '▲ UP' : '▼ DOWN'}</td><td class="${cls}">${res}</td></tr>`;
  }).join('');
}

$('assets').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  asset = b.dataset.a; store.set('asset', asset); renderPickers();
});
$('times').addEventListener('click', e => {
  const b = e.target.closest('[data-iv]'); if (!b) return;
  time = b.dataset.iv; store.set('time', time); renderPickers();
});
$('langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'bn' : 'en'; store.set('lang', lang); renderText(); });
$('go').addEventListener('click', getSignal);
$('clear').addEventListener('click', () => { history = []; store.set('history', history); renderHistory(); });

renderPickers();
renderText();
checkPending();
setInterval(checkPending, 15000);
</script>
</body>
</html>
